name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 MinGW-w64 Environment
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-python

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Compile Executable
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Package .EXE and Runtime DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          # Copy the compiled binary
          cp build/audio_engine.exe dist/

          # Bundle required FFmpeg, Lua, and MinGW dependency DLLs
          cp /mingw64/bin/avcodec-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/avformat-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/avutil-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/swresample-*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/lua5*.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true
          cp /mingw64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true

          # Include script directories if present
          if [ -d "scripts" ]; then
            cp -r scripts dist/
          fi

      - name: Upload Windows Distributable
        uses: actions/upload-artifact@v4
        with:
          name: audio-daw-engine-windows-x64
          path: dist/
