name: Build Multitrack Windows Bundle

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Ready-To-Use Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 Toolchain & Libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2

      - name: Clean Cache & Configure CMake
        shell: msys2 {0}
        run: |
          rm -rf build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile Executable
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Package Complete Windows Application
        shell: msys2 {0}
        run: |
          mkdir -p dist
          mkdir -p dist/scripts/lua
          mkdir -p dist/scripts/python

          # Copy executable
          cp build/*.exe dist/

          # Copy all required dynamic libraries directly from ucrt64
          cp /ucrt64/bin/avcodec-*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/avformat-*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/avutil-*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/swresample-*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/swscale-*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/SDL2.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/lua5*.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libwinpthread-1.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libgcc_s_seh-1.dll dist/ 2>/dev/null || true
          cp /ucrt64/bin/libstdc++-6.dll dist/ 2>/dev/null || true

          # Embedded standalone Python runtime
          curl -sSL -o python-embed.zip https://www.python.org/ftp/python/3.11.8/python-3.11.8-embed-amd64.zip
          unzip -q -o python-embed.zip -d dist/python/
          rm python-embed.zip

          # Copy script templates if they exist
          if [ -d "scripts" ]; then
            cp -r scripts/* dist/scripts/ 2>/dev/null || true
          fi

      - name: Upload Ready-to-Use Zip
        uses: actions/upload-artifact@v4
        with:
          name: Multitrack-Editor-Windows
          path: dist/
