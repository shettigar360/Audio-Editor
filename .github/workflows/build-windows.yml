name: Build Multitrack Windows Bundle

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build-windows:
    name: Build Ready-To-Use Windows App
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 Toolchain & Libraries
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ntldd

      - name: Clean Cache & Configure CMake
        shell: msys2 {0}
        run: |
          rm -rf build
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Compile Executable
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Package Executable with Complete Dependency Tree
        shell: msys2 {0}
        run: |
          mkdir -p dist
          mkdir -p dist/scripts/lua
          mkdir -p dist/scripts/python

          # 1. Copy the compiled executable
          cp build/*.exe dist/

          # 2. Recursively trace and copy EVERY required DLL (FFmpeg, SDL2, codecs, runtimes)
          cd dist
          TARGET_EXE=$(ls *.exe | head -n 1)

          # Run ntldd recursively until all sub-dependencies are copied
          for i in {1..4}; do
            ntldd -R *.exe *.dll 2>/dev/null | grep -i "/ucrt64/bin/" | awk '{print $3}' | sort -u | while read -r dll; do
              if [ -f "$dll" ] && [ ! -f "$(basename "$dll")" ]; then
                cp "$dll" .
              fi
            done
          done
          cd ..

          # 3. Embed official standalone Python runtime
          curl -sSL -o python-embed.zip https://www.python.org/ftp/python/3.11.8/python-3.11.8-embed-amd64.zip
          unzip -q -o python-embed.zip -d dist/python/
          rm python-embed.zip

          # 4. Copy scripts if present
          if [ -d "scripts" ]; then
            cp -r scripts/* dist/scripts/ 2>/dev/null || true
          fi

      - name: Upload Ready-to-Use Zip
        uses: actions/upload-artifact@v4
        with:
          name: Multitrack-Editor-Windows
          path: dist/
