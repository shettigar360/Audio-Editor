name: Build Ready-To-Use Windows App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-lua
            mingw-w64-ucrt-x86_64-python

      - name: Clean Cache & Configure CMake
        shell: msys2 {0}
        run: |
          rm -rf build
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Compile Executable
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Package Executable with Complete Dependency Tree
        shell: msys2 {0}
        run: |
          mkdir -p package
          cp build/audio_editor.exe package/
          for dll in $(ntldd -R build/audio_editor.exe | grep ucrt64 | awk '{print $3}'); do
            cp "$dll" package/ 2>/dev/null || true
          done

      - name: Upload Ready-to-Use Zip
        uses: actions/upload-artifact@v4
        with:
          name: DAW_Windows_Bundle
          path: package/
